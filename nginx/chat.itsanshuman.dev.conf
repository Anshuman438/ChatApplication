# Nginx Configuration for chat.itsanshuman.dev
# Place in: /etc/nginx/sites-available/chat.itsanshuman.dev
# Link to: /etc/nginx/sites-enabled/chat.itsanshuman.dev

server {
    listen 80;
    server_name chat.itsanshuman.dev;

    # Root directory for static web chat files
    root /var/www/chat.itsanshuman.dev/web;
    index index.html;

    # Static web app files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Desktop Client JAR Download Route
    location /download/ChatApp-Desktop.jar {
        alias /var/www/chat.itsanshuman.dev/downloads/ChatApp-Desktop.jar;
        add_header Content-Disposition 'attachment; filename="ChatApp-Desktop.jar"';
    }

    # WebSocket Reverse Proxy to Java Chat Server (port 8081)
    location /ws {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        # WebSocket headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Client IP and host forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeout so WebSocket connections don't drop during idle chat
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
